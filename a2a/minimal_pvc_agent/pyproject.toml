[project]
name = "minimal-pvc-agent"
version = "0.3.0"
description = "Minimal A2A agent demonstrating Kagenti persistence via harness-native SQLite on a PVC."
license = { text = "Apache" }
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server,sql]>=0.3.26,<1.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.46.0",
    "opentelemetry-exporter-otlp",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
]

[project.scripts]
server = "minimal_pvc_agent.agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
