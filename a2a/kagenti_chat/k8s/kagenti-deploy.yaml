---
# Deployment for kagenti_chat agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagenti-chat
  namespace: team1
  labels:
    app: kagenti-chat
    kagenti.io/framework: a2a
    kagenti.io/inject: disabled
    app.kubernetes.io/name: kagenti-chat
    app.kubernetes.io/component: agent
  annotations:
    kagenti.io/description: "General-purpose chat agent using llm-d and AG2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kagenti-chat
  template:
    metadata:
      labels:
        app: kagenti-chat
        kagenti.io/framework: a2a
        kagenti.io/inject: disabled
    spec:
      containers:
        - name: kagenti-chat
          image: 10.43.28.116:5000/kagenti-chat:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: A2A_HOST
              value: "0.0.0.0"
            - name: A2A_PORT
              value: "8000"
            - name: LLM_API_KEY
              value: "dummy"
            - name: LLM_API_BASE
              value: "http://ms-meta-llama-llama-3-3-70b-instruct-svc.llm-d.svc.cluster.local:8000/v1"
            - name: LLM_MODEL
              value: "meta-llama/Llama-3.3-70B-Instruct"
            - name: LLM_TEMPERATURE
              value: "0.2"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagenti-chat-api-key
                  key: api-key
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /.well-known/agent.json
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /.well-known/agent.json
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
# Service for kagenti_chat
apiVersion: v1
kind: Service
metadata:
  name: kagenti-chat
  namespace: team1
  labels:
    app: kagenti-chat
spec:
  selector:
    app: kagenti-chat
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
# HTTPRoute for external access via Kagenti shared HTTP gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagenti-chat
  namespace: team1
  labels:
    app: kagenti-chat
spec:
  parentRefs:
    - name: http
      namespace: kagenti-system
      kind: Gateway
  hostnames:
    - "kagenti-chat.163-75-85-180.sslip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kagenti-chat
          port: 8000
